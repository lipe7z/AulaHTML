<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hero Section Responsiva</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <section class="hero">
    <div class="hero-container">
      
      <!-- Lado Esquerdo: Textos e Chamada para Ação -->
      <div class="hero-text">
        <span class="badge">🚀 Novo Lançamento</span>
        <h1>Crie experiências digitais incríveis</h1>
        <p>Desenvolvemos soluções sob medida para destacar sua marca no mercado e atrair mais clientes de forma simples e rápida.</p>
        
        <div class="hero-buttons">
          <a href="#" class="btn btn-primary">Começar Agora</a>
          <a href="#" class="btn btn-secondary">Ver Projetos</a>
        </div>
      </div>

      <!-- Lado Direito: Elemento Visual/Imagem -->
      <div class="hero-visual">
        <div class="card-preview">
          <div class="card-header">
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
          </div>
          <div class="card-body">
            <div class="skeleton-line full"></div>
            <div class="skeleton-line medium"></div>
            <div class="skeleton-box"></div>
          </div>
        </div>
      </div>

    </div>
  </section>

</body>
</html>
